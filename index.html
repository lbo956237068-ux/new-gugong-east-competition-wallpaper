<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>故宫以东完美世界文创校园设计大赛</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            background:#000;
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
        }
        #wallpaper{
            max-width:100%;
            max-height:100vh;
            object-fit:contain;
        }
        .tip{
            color:#fff;
            margin-top:16px;
            font-size:14px;
            text-align:center;
            padding:0 10px;
        }
    </style>
</head>
<body>
    <img id="wallpaper">
    <div class="tip">长按图片保存壁纸｜故宫以东完美世界文创校园设计大赛</div>
    <script>
        const imgList = [
            "图片1.png",
            "图片2.png",
            "图片3.png",
            "图片4.png",
            "图片5.png",
            "图片6.png",
            "图片7.png",
            "图片8.png",
            "图片9.png",
            "图片10.png",
            "图片11.png"
        ];
        const randomImg = imgList[Math.floor(Math.random() * imgList.length)];
        document.getElementById("wallpaper").src = randomImg;
    </script>
</body>
</html>
